name: Build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [linux64, linux32]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build
        run: nix build ".#${{ matrix.package }}" --print-build-logs

      - name: Upload modules
        uses: actions/upload-artifact@v4
        with:
          name: gm_bytecode-${{ matrix.package }}
          path: |
            result/lib/gmsv_bytecode_*.dll
            result/lib/gmcl_bytecode_*.dll
          if-no-files-found: error

  windows:
    name: Windows (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win64
            arch: x64
          - target: win32
            arch: x86

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Install Ninja
        run: choco install ninja -y

      - name: Configure
        run: cmake --preset ${{ matrix.target }}

      - name: Build
        run: cmake --build --preset ${{ matrix.target }}

      - name: Upload modules
        uses: actions/upload-artifact@v4
        with:
          name: gm_bytecode-${{ matrix.target }}
          path: |
            build/${{ matrix.target }}/gmsv_bytecode_*.dll
            build/${{ matrix.target }}/gmcl_bytecode_*.dll
          if-no-files-found: error

  release:
    name: Publish release
    needs: [linux, windows]
    if: github.event_name != 'pull_request' && success()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download modules
        uses: actions/download-artifact@v4
        with:
          pattern: gm_bytecode-*
          path: modules
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.sha }}
          name: ${{ github.sha }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: modules/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
